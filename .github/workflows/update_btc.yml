name: Update BTC price daily

on:
  schedule:
    # Roda todos os dias às 00h05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub se precisar testar

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python config
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m backend/update_btc.py